<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plan de séance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&family=Jersey+15&display=swap" rel="stylesheet">
<style>
  /* Thème Burden Hunt (page Speedrun) : papier, encre, marine, rouge, or. Ne change pas ce bloc. */
  :root {
    --paper: #f8f3e5; --card: #fdfcf8; --ink: #1b1a17; --ink2: #4a4842; --hair: #d9d6cf;
    --navy: #1d295e; --crim: #c22238; --gold: #f7c12f; --lock: #b9b5aa;
    --px: 'Jersey 15', 'Courier New', monospace; --tx: 'Figtree', system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --paper: #12172f; --card: #1a2142; --ink: #eef0f8; --ink2: #b9bfdb; --hair: #2e3866; --navy: #0d1330; --lock: #4b547e;
  } }
  :root[data-theme="dark"] { --paper: #12172f; --card: #1a2142; --ink: #eef0f8; --ink2: #b9bfdb; --hair: #2e3866; --navy: #0d1330; --lock: #4b547e; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 var(--tx); }
  .wrap { max-width: 760px; margin: 0 auto; padding: 16px 16px 40px; }

  /* Le bandeau du haut : où on en est */
  .hud { background: var(--navy); color: #fff; border: 3px solid var(--ink); box-shadow: 5px 5px 0 var(--ink); padding: 16px; }
  .brand { font: 18px/1 var(--px); letter-spacing: 2px; color: var(--gold); }
  .idea { color: #d7dcf2; font-size: 14px; margin-top: 2px; }
  .lvl { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  .lvl b { font: 52px/0.9 var(--px); color: var(--gold); letter-spacing: 1px; }
  .lvl span { font: 30px/1 var(--px); letter-spacing: 1px; }
  .next { margin-top: 12px; background: #fff; color: #1b1a17; border: 3px solid var(--gold); padding: 10px 12px; font-weight: 800; font-size: 16px; }
  .next small { display: block; font: 15px/1 var(--px); letter-spacing: 2px; color: var(--crim); margin-bottom: 4px; }

  /* Le chemin des niveaux */
  .path { display: flex; align-items: flex-start; margin: 22px 0 6px; }
  .node { flex: 1 1 0; min-width: 0; text-align: center; position: relative; }
  .node::before { content: ''; position: absolute; top: 21px; left: -50%; width: 100%; height: 5px; background: var(--lock); }
  .node:first-child::before { display: none; }
  .node.won::before, .node.now::before { background: var(--gold); }
  .dot { position: relative; z-index: 1; width: 46px; height: 46px; margin: 0 auto; border: 3px solid var(--ink); background: var(--card); display: grid; place-items: center; font: 26px/1 var(--px); color: var(--ink2); }
  .node.won .dot { background: var(--gold); color: #1b1a17; }
  .node.now .dot { background: var(--crim); color: #fff; box-shadow: 0 0 0 4px rgba(194,34,56,.25); transform: scale(1.12); }
  .node.lock .dot { background: transparent; border-style: dashed; border-color: var(--lock); color: var(--lock); }
  .lab { font: 15px/1.1 var(--px); letter-spacing: 1px; margin-top: 8px; color: var(--ink2); padding: 0 2px; }
  .node.now .lab { color: var(--crim); }
  .node.won .lab { color: var(--ink); }

  /* Les cartes gagnées */
  h2 { font: 26px/1 var(--px); letter-spacing: 2px; margin: 24px 0 0; }
  .loot { background: var(--card); border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); margin-top: 12px; padding: 12px 14px; }
  .loot .t { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .loot .n { font: 24px/1 var(--px); letter-spacing: 1px; flex: 1; min-width: 0; }
  .chip { font: 15px/1 var(--px); letter-spacing: 1px; padding: 5px 8px 4px; background: var(--gold); color: #1b1a17; border: 2px solid var(--ink); }
  .sum { margin: 8px 0 0; font-weight: 800; font-size: 16px; overflow-wrap: anywhere; }
  .sum2 { margin: 4px 0 0; color: var(--ink2); overflow-wrap: anywhere; }
  details { margin-top: 8px; }
  summary { cursor: pointer; font: 16px/1 var(--px); letter-spacing: 1px; color: var(--crim); }
  ul { list-style: none; margin: 8px 0 0; padding: 0; }
  li { padding: 6px 0; border-top: 1px solid var(--hair); overflow-wrap: anywhere; font-size: 14px; }
  .k { font-weight: 800; }
  a { color: var(--crim); }
  .todo { margin-top: 12px; color: var(--ink2); font-size: 14px; }
  @media (max-width: 520px) {
    .dot { width: 36px; height: 36px; font-size: 20px; }
    .node::before { top: 16px; }
    .lab { font-size: 12px; letter-spacing: 0; overflow-wrap: anywhere; }
    .node.lock .lab { display: none; }
    .lvl b { font-size: 42px; } .lvl span { font-size: 26px; }
  }
  @media (prefers-reduced-motion: no-preference) { .node.now .dot { animation: pulse 1.6s ease-in-out infinite; } }
  @keyframes pulse { 50% { box-shadow: 0 0 0 9px rgba(194,34,56,.08); } }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<!-- LES DONNÉES : c'est le seul bloc à remplir et à mettre à jour.
     etat : "won" (gagné) · "now" (en cours, un seul) · "lock" (verrouillé).
     prochaine_action : UNE phrase courte, ce qu'on fait maintenant.
     Pour un niveau gagné : "resume" = l'essentiel en une phrase courte (affichée en gras),
     "resume2" = une 2e ligne courte facultative, "lignes" = le détail (caché derrière « Voir le détail »). -->
<script type="application/json" id="carte">
{
  "marque": "",
  "idee": "",
  "prochaine_action": "Dis-moi ton idée de business.",
  "etapes": [
    { "nom": "La cible", "etat": "now", "resume": "", "resume2": "", "lignes": [] },
    { "nom": "Le Katana", "etat": "lock", "resume": "", "resume2": "", "lignes": [] },
    { "nom": "L'offre", "etat": "lock", "resume": "", "resume2": "", "lignes": [] },
    { "nom": "La mini-offre", "etat": "lock", "resume": "", "resume2": "", "lignes": [] },
    { "nom": "Le site", "etat": "lock", "resume": "", "resume2": "", "lignes": [] },
    { "nom": "Les pubs", "etat": "lock", "resume": "", "resume2": "", "lignes": [] },
    { "nom": "Le plan", "etat": "lock", "resume": "", "resume2": "", "lignes": [] }
  ],
  "pas_compte": ""
}
</script>

<script>
(function () {
  var d = JSON.parse(document.getElementById('carte').textContent);
  var esc = function (t) { var e = document.createElement('span'); e.textContent = t == null ? '' : String(t); return e.innerHTML; };
  var link = function (t) { return esc(t).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">lien</a>'); };
  var E = d.etapes, total = E.length, cur = -1;
  E.forEach(function (e, i) { if (e.etat === 'now' && cur < 0) cur = i; });
  var done = cur < 0 && E.every(function (e) { return e.etat === 'won'; });

  var h = '<div class="hud"><div class="brand">' + esc(d.marque || 'PLAN DE SÉANCE') + '</div>';
  if (d.idee) h += '<div class="idea">' + esc(d.idee) + '</div>';
  if (done) h += '<div class="lvl"><b>GAGNÉ</b><span>Les ' + total + ' niveaux sont terminés</span></div>';
  else if (cur >= 0) h += '<div class="lvl"><b>NIVEAU ' + (cur + 1) + '/' + total + '</b><span>' + esc(E[cur].nom) + '</span></div>';
  if (d.prochaine_action) h += '<div class="next"><small>' + (done ? 'À TOI DE JOUER' : 'PROCHAINE ACTION') + '</small>' + esc(d.prochaine_action) + '</div>';
  h += '</div>';

  h += '<div class="path">' + E.map(function (e, i) {
    var mark = e.etat === 'won' ? '✓' : (e.etat === 'now' ? (i + 1) : '🔒');
    return '<div class="node ' + e.etat + '"><div class="dot">' + mark + '</div><div class="lab">' + esc(e.nom) + '</div></div>';
  }).join('') + '</div>';

  var won = E.filter(function (e) { return e.etat === 'won'; });
  if (won.length) {
    h += '<h2>CE QUE TU AS GAGNÉ</h2>';
    E.forEach(function (e, i) {
      if (e.etat !== 'won') return;
      h += '<div class="loot"><div class="t"><span class="n">' + (i + 1) + ' · ' + esc(e.nom) + '</span><span class="chip">GAGNÉ</span></div>';
      if (e.resume) h += '<p class="sum">' + link(e.resume) + '</p>';
      if (e.resume2) h += '<p class="sum2">' + link(e.resume2) + '</p>';
      if (e.lignes && e.lignes.length) {
        h += '<details><summary>Voir le détail</summary><ul>' + e.lignes.map(function (l) {
          return '<li><span class="k">' + esc(l.k) + ' :</span> ' + link(l.v) + '</li>';
        }).join('') + '</ul></details>';
      }
      h += '</div>';
    });
  }
  if (d.pas_compte) h += '<p class="todo"><strong>Pas compté ici :</strong> ' + esc(d.pas_compte) + '</p>';
  document.getElementById('app').innerHTML = h;
})();
</script>
</body>
</html>
